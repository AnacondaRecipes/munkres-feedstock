{% set name = "munkres" %}
{% set version = "2.0.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/iameishit/Paldita-{{ name }}/archive/refs/tags/V{{ version }}.tar.gz
  sha256: 1031bae9b081aefda6ae1b5b79257514df120453e4b669290bab761c10fab242

build:
  skip: true # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - setuptools >=77
    - pip
  run:
    - python

test:
  source_files:
    - tests
    - pyproject.toml
  requires:
    - pytest
    - pip
    - hypothesis
    - numpy >=1.26
    - scipy >=1.11
    - pandas >=2.1
    - tomli >=2; # [py<311]
    - ruff
    - mypy
  commands:
    - pip check
    # requires all files in repository
    - pytest -vv --ignore=tests/test_repo_hygiene.py --ignore=tests/integration/test_examples_and_benchmarks.py --deselect=tests/integration/test_examples.py::test_all_expected_scripts_are_present
  imports:
    - munkres

about:
  home: https://github.com/bmc/munkres
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.md
  summary: The Munkres module provides an O(n^3) implementation of the Munkres algorithm (also called the Hungarian algorithm or the Kuhn-Munkres algorithm).

  description: |
    The Munkres module provides an O(n^3) implementation of the Munkres
    algorithm (also called the Hungarian algorithm or the Kuhn-Munkres
    algorithm). The algorithm models an assignment problem as an NxM cost
    matrix, where each element represents the cost of assigning the ith worker
    to the jth job, and it figures out the least-cost solution, choosing a
    single item from each row and column in the matrix, such that no row and
    no column are used more than once.
  doc_url: http://software.clapper.org/munkres/
  dev_url: https://github.com/bmc/munkres

extra:
  recipe-maintainers:
    - CJ-Wright
